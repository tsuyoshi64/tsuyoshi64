name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Clone github-readme-stats
        run: |
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/grs

      - name: Install dependencies
        working-directory: /tmp/grs
        run: npm ci

      - name: Start local server
        working-directory: /tmp/grs
        env:
          PAT_1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node src/serve.js &
          sleep 5  # wait for server to be ready

      - name: Fetch GitHub Stats SVG
        run: |
          curl -sf "http://localhost:9000/api?username=tsuyoshi64&show_icons=true&bg_color=0d1117&title_color=00f5ff&icon_color=ff00ff&text_color=c9d1d9&border_color=bf00ff&rank_icon=github" \
            -o .svg/github-stats.svg \
            --retry 3 --retry-delay 3

      - name: Fetch Top Languages Pie SVG
        run: |
          curl -sf "http://localhost:9000/api/top-langs/?username=tsuyoshi64&layout=pie&bg_color=0d1117&title_color=00f5ff&text_color=c9d1d9&border_color=bf00ff" \
            -o .svg/top-langs-pie.svg \
            --retry 3 --retry-delay 3

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .svg/github-stats.svg .svg/top-langs-pie.svg
          git diff --cached --quiet || git commit -m "chore: update github stats SVGs [skip ci]"
          git push
